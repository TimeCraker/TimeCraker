<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="200" viewBox="0 0 1440 200" role="img" aria-label="TimeCraker delivered capabilities">
  <!-- 底：ink -->
  <rect width="1440" height="200" rx="16" fill="#1C1917"/>

  <!-- 六枚能力胶囊：等距 6 列，中心 y=100 -->
  <!-- 每枚：coral 描边胶囊 + 简约几何图标 + 双行标签 -->

  <!-- 1. AI Agent -->
  <g transform="translate(40,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#CC785C" stroke-width="1.5" opacity="0.9"/>
    <circle cx="100" cy="42" r="16" fill="none" stroke="#CC785C" stroke-width="2.5"/>
    <circle cx="100" cy="42" r="5" fill="#CC785C"/>
    <path d="M84 74 L116 74" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="100" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">AI Agent</text>
  </g>

  <!-- 2. RPA 自动化 -->
  <g transform="translate(272,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#57534E" stroke-width="1.5"/>
    <rect x="82" y="26" width="36" height="28" rx="5" fill="none" stroke="#CC785C" stroke-width="2.5"/>
    <path d="M100 54 L100 66 M100 66 L92 60 M100 66 L108 60" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M76 74 L124 74" stroke="#57534E" stroke-width="2" stroke-linecap="round"/>
    <path d="M76 82 L112 82" stroke="#57534E" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">RPA 自动化</text>
  </g>

  <!-- 3. BLE 硬件 -->
  <g transform="translate(504,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#57534E" stroke-width="1.5"/>
    <path d="M92 26 v56 M100 26 v56 M108 26 v34" stroke="#CC785C" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 40 a18 18 0 0 1 24 0 M84 32 a26 26 0 0 1 32 0" stroke="#CC785C" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="100" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">BLE 硬件</text>
  </g>

  <!-- 4. 语音 TTS -->
  <g transform="translate(736,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#57534E" stroke-width="1.5"/>
    <path d="M88 48 h8 v-8 h6 v20 h6 v-14 h6 v8 h6" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M84 34 a22 22 0 0 1 0 32 M76 26 a34 34 0 0 1 0 48" stroke="#57534E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="100" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">语音 TTS</text>
  </g>

  <!-- 5. 跨端游戏 -->
  <g transform="translate(968,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#57534E" stroke-width="1.5"/>
    <circle cx="100" cy="44" r="14" fill="none" stroke="#CC785C" stroke-width="2.5"/>
    <path d="M100 30 L100 20 M100 58 L100 68 M86 44 L76 44 M114 44 L124 44 M90 34 L83 27 M110 34 L117 27 M90 54 L83 61 M110 54 L117 61" stroke="#CC785C" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">跨端游戏</text>
  </g>

  <!-- 6. 生产运维 -->
  <g transform="translate(1200,40)">
    <rect width="200" height="120" rx="14" fill="none" stroke="#57534E" stroke-width="1.5"/>
    <path d="M86 60 a14 14 0 0 1 28 0 v6 h-28 z" fill="#CC785C"/>
    <path d="M96 50 v-10 M104 50 v-10" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="78" y="66" width="44" height="5" rx="2.5" fill="#57534E"/>
    <text x="100" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#FAF6F0" font-weight="600">生产运维</text>
  </g>
</svg>
